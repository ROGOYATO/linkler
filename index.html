  <title>TOBB ETÜ ROGOYATO</title>

  <style>
    :root {
      --bg: #f1f5f9;
      --bg-accent: #e0f2fe;
      --card: #ffffff;
      --card-hover: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --accent: #0284c7;
      --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --bg-accent: #0c2a43;
        --card: #111a2e;
        --card-hover: #17223a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #1e293b;
        --accent: #38bdf8;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
      }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 50% -200px, var(--bg-accent), transparent 70%),
        var(--bg);
      display: flex;
      justify-content: center;
      padding: 48px 16px 32px;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #fff;
      box-shadow: var(--shadow);
    }
    .logo svg { width: 48px; height: 48px; }

    h1 {
      margin: 20px 0 4px;
      font-size: 1.5rem;
      letter-spacing: .02em;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: .95rem;
      text-align: center;
      line-height: 1.4;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a.link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      min-height: 60px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: transform .15s ease, background-color .15s ease, border-color .15s ease;
    }
    a.link:hover { background: var(--card-hover); border-color: var(--accent); transform: translateY(-1px); }
    a.link:active { transform: translateY(0); }
    a.link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .icon {
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #fff;
    }
    .icon svg { width: 20px; height: 20px; }

    .label { flex: 1; min-width: 0; }

    .chevron { flex: none; width: 18px; height: 18px; color: var(--muted); }

    .web       { background: #0ea5e9; }
    .form      { background: #7c3aed; }
    .instagram { background: linear-gradient(45deg, #f59e0b, #ec4899 50%, #8b5cf6); }
    .linkedin  { background: #0a66c2; }
    .whatsapp  { background: #22c55e; }
    .sponsor   { background: #f97316; }
    .project   { background: #0d9488; }

    .tag {
      display: block;
      margin-top: 2px;
      font-size: .75rem;
      font-weight: 500;
      color: var(--muted);
    }

    footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: .8rem;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      a.link { transition: none; }
      a.link:hover { transform: none; }
    }
  </style>
</head>
